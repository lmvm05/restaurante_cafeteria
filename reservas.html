    <main>
        <section class="reservacion-form-section">
            <h2>Reservar Ahora</h2>
            <p>Completa el siguiente formulario para confirmar tu reservación.</p>
            
            <form id="reservationForm">
                
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
                
                <label for="fecha">Fecha de la Reserva:</label>
                <input type="date" id="fecha" name="fecha" required>
                
                <label for="hora">Hora de la Reserva:</label>
                <input type="time" id="hora" name="hora" required>
                
                <label for="personas">Número de Personas:</label>
                <input type="number" id="personas" name="personas" min="1" max="15" value="2" required>
                
                <label for="comentarios">Comentarios Adicionales:</label>
                <textarea id="comentarios" name="comentarios" rows="3"></textarea>
                
                <button type="submit">Confirmar Reservación</button>
                
                <p id="message" class="hidden"></p>
                
            </form>
        </section>
    </main>
